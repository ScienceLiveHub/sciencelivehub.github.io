<title id="credit-diagram-title-wide">Who gets credit, today and on Science Live</title>
<desc id="credit-diagram-desc-wide">Today: a paper credits only its authors. Replications end up as a footnote or are never published, doubts are voiced but never recorded, and peer review happens once, anonymously and without credit. On Science Live, each contribution is its own signed nanopublication: the claim, signed by its author; the replication, signed by the replicator, whether it confirms, qualifies or refutes; and the request, signed by the person who asked. The replication cites both the claim it tests and the request it answers. And on any of them, open review: anyone can approve, disapprove or comment, at any time, each signed by the reviewer.</desc>
