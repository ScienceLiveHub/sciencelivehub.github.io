<title id="constellation-title-wide">Research is never finished: a real example</title>
<desc id="constellation-desc-wide">A real example. Research question: does extreme heat drive bumble bee declines? Claim, from Soroye et al. 2020 in Science: heat raises local extinction. Replications arrive over time and each tests the claim: in April 2026 a replication on Iberian bumble bees with independent data confirms it; in May 2026 an extension to future projections confirms it; also in May 2026 a sensitivity test qualifies it, because projected rankings depend on the grid resolution. Next, the claim is open to another region or method. The state of the evidence today is validated, with one qualification, and every step is signed, dated and traceable back to the question.</desc>
