<title id="tools-diagram-title-wide">From FAIR rules to trusted, credited research on Science Live</title>
<desc id="tools-diagram-desc-wide">How the Science Live tools fit together, layer by layer. FAIR rules: a nanopublication template for every step (FORRT chain, claim, dataset). FAIR resources: ORCID, DOI, OpenAIRE, Zenodo, RO-Crate. Deterministic guardrails that do not depend on the model: the FORRT Research MCP and the replication template. AI agents do the work inside the guardrails, starting from a research question or a replication request, using Replication Radar and the OpenAIRE MCP. Researchers validate: they decide the verdict and its limits and sign with their ORCID. The result is published on Science Live, signed and credited to them, where people can search it, read it as a story and cite it. Published results feed new questions and replication requests.</desc>
