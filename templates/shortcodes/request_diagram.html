<title id="request-diagram-title-wide">How a replication request moves</title>
<desc id="request-diagram-desc-wide">How a replication request moves. You ask, signed with your ORCID. Replication Radar checks whether the claim has already been replicated. If yes, you read the verdict: the existing evidence, with its limits. If not, the community takes it on for free and is credited, or our experts check feasibility and quote, from 2,000 euros. Either way the result is published on Science Live as a signed FORRT chain that cites your request.</desc>
